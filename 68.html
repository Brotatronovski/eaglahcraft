<script>
(function () {
  var G = window.GAME_FILES;
  function noop() {}
  function res(v) { return Promise.resolve(v); }

  function deep() {
    var f = function () { return res(deep()); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === "then" || p === "catch" || p === "finally") return undefined;
        if (typeof p === "symbol") return undefined;
        return deep();
      },
      apply: function () { return res(undefined); }
    });
  }

  var store = {};
  var stats = {};
  try { store = JSON.parse(localStorage.getItem("yg_saves") || "{}") || {}; } catch (e) { store = {}; }
  try { stats = JSON.parse(localStorage.getItem("yg_stats") || "{}") || {}; } catch (e) { stats = {}; }
  function persist() {
    try { localStorage.setItem("yg_saves", JSON.stringify(store)); } catch (e) {}
    try { localStorage.setItem("yg_stats", JSON.stringify(stats)); } catch (e) {}
  }

  var playerObj = {
    getData: function (keys) {
      if (!keys || !keys.length) return res(store);
      var o = {};
      for (var i = 0; i < keys.length; i++) if (store[keys[i]] !== undefined) o[keys[i]] = store[keys[i]];
      return res(o);
    },
    setData: function (d) { for (var k in d) store[k] = d[k]; persist(); return res(true); },
    getStats: function () { return res(stats); },
    setStats: function (s) { for (var k in s) stats[k] = s[k]; persist(); return res(true); },
    incrementStats: function (s) { for (var k in s) stats[k] = (stats[k] || 0) + s[k]; persist(); return res(stats); },
    getName: function () { return "Player"; },
    getPhoto: function () { return "null"; },
    getUniqueID: function () { return "local-player"; },
    getMode: function () { return "lite"; },
    isAuthorized: function () { return false; },
    getPayingStatus: function () { return "unknown"; },
    signature: "",
    scopePermissions: { avatar: "not_set", public_name: "not_set" }
  };

  var lbObj = {
    setLeaderboardScore: function () { return res(true); },
    getLeaderboardDescription: function (n) {
      return res({
        appID: "0", default: true, title: { en: n },
        description: {
          invert_sort_order: false,
          score_format: { options: { decimal_offset: 0 } },
          type: "numeric"
        }
      });
    },
    getLeaderboardEntries: function () { return res({ leaderboard: {}, ranges: [], userRank: 0, entries: [] }); },
    getLeaderboardPlayerEntry: function () {
      var e = new Error("no entry");
      e.code = "LEADERBOARD_PLAYER_NOT_PRESENT";
      return Promise.reject(e);
    }
  };

  var base = {
    environment: {
      app: { id: "0" },
      browser: { lang: G.LANG },
      i18n: { lang: G.LANG, tld: "com" },
      payload: null
    },
    deviceInfo: {
      type: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
      isMobile: function () { return /iPhone|iPod|Android/i.test(navigator.userAgent); },
      isDesktop: function () { return !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent); },
      isTablet: function () { return /iPad/i.test(navigator.userAgent); },
      isTV: function () { return false; }
    },
    adv: {
      showFullscreenAdv: function (o) {
        var c = (o && o.callbacks) || {};
        setTimeout(function () { try { c.onClose && c.onClose(false); } catch (e) {} }, 0);
      },
      showRewardedVideo: function (o) {
        var c = (o && o.callbacks) || {};
        setTimeout(function () {
          try { c.onOpen && c.onOpen(); } catch (e) {}
          try { c.onRewarded && c.onRewarded(); } catch (e) {}
          try { c.onClose && c.onClose(); } catch (e) {}
        }, 0);
      },
      showBannerAdv: function () { return res({ stickyAdvIsShowing: false, reason: "adv_is_not_connected" }); },
      hideBannerAdv: function () { return res({ stickyAdvIsShowing: false }); },
      getBannerAdvStatus: function () { return res({ stickyAdvIsShowing: false, reason: "adv_is_not_connected" }); }
    },
    features: {
      LoadingAPI: { ready: noop },
      GameplayAPI: { start: noop, stop: noop },
      GamesAPI: { getAllGames: function () { return res({ games: [], developerURL: "" }); } }
    },
    leaderboards: {
      setScore: function () { return res(true); },
      getDescription: lbObj.getLeaderboardDescription,
      getEntries: lbObj.getLeaderboardEntries,
      getPlayerEntry: lbObj.getLeaderboardPlayerEntry
    },
    getLeaderboards: function () { return res(lbObj); },
    getPlayer: function () { return res(playerObj); },
    getPayments: function () { return Promise.reject(new Error("payments unavailable")); },
    getStorage: function () { return res(window.localStorage); },
    getFlags: function () { return res({}); },
    feedback: {
      canReview: function () { return res({ value: false, reason: "NO_AUTH" }); },
      requestReview: function () { return res({ feedbackSent: false }); }
    },
    shortcut: {
      canShowPrompt: function () { return res({ canShow: false }); },
      showPrompt: function () { return res({ outcome: "dismissed" }); }
    },
    screen: {
      fullscreen: { status: "off", request: function () { return res(true); }, exit: function () { return res(true); } }
    },
    auth: { openAuthDialog: function () { return Promise.reject(new Error("no auth")); } },
    isAvailableMethod: function () { return res(false); },
    dispatchEvent: function () { return res(true); },
    on: function () { return noop; },
    off: function () { return true; },
    EVENT_HISTORY_BACK: "HISTORY_BACK",
    EVENT_GAME_API_PAUSE: "game_api_pause",
    EVENT_GAME_API_RESUME: "game_api_resume"
  };

  var proxied = new Proxy(base, {
    get: function (t, p) {
      if (p === "then" || p === "catch" || p === "finally") return undefined;
      if (p in t) return t[p];
      if (typeof p === "symbol") return undefined;
      return deep();
    }
  });

  window.YaGames = { init: function () { return res(proxied); } };
})();
</script>

<script>
window.hideFullScreenButton = "";
window.myGameInstance = null;
window.ysdk = null;
window.player = null;
window.leaderboard = null;
window.payments = null;
window.initGame = false;
window.nowFullAdOpen = false;
window.cloudSaves = "noData";
window.paymentsData = "none";
window.environmentData = "null";
window.playerData = "noData";

(function () {
  var C = window.GAME_CFG;
  var G = window.GAME_FILES;
  var B = window.GAME_B;

  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingCover = document.querySelector("#loading-cover");
  var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var spinner = document.querySelector(".spinner");

  var config = null;

  function FetchBytes(url) {
    return fetch(url, { cache: "force-cache" }).then(function (r) {
      if (!r.ok) throw new Error(url + " -> " + r.status);
      return r.arrayBuffer();
    }).then(function (b) { return new Uint8Array(b); });
  }

  function ToBlobUrl(u8, type) {
    return URL.createObjectURL(new Blob([u8], { type: type || "application/octet-stream" }));
  }

  function FetchParts(name, count, type) {
    var jobs = [];
    for (var i = 0; i < count; i++) jobs.push(FetchBytes(B(name + ".part" + i)));
    return Promise.all(jobs).then(function (chunks) {
      var total = 0, i;
      for (i = 0; i < chunks.length; i++) total += chunks[i].length;
      var merged = new Uint8Array(total), off = 0;
      for (i = 0; i < chunks.length; i++) { merged.set(chunks[i], off); off += chunks[i].length; }
      return ToBlobUrl(merged, type);
    });
  }

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) container.className = "unity-mobile";
  loadingCover.style.background = "url('" + G.BACKGROUND + "') center / cover";
  loadingCover.style.display = "";

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.FocusGame = function () {
    try { window.focus(); canvas.focus(); } catch (e) {}
  };
  window.addEventListener("pointerdown", function () { window.FocusGame(); });
  window.addEventListener("touchstart", function () { window.FocusGame(); });

  try {
    var rpl = Element.prototype.requestPointerLock;
    Element.prototype.requestPointerLock = function () {
      try { var r = rpl.apply(this, arguments); if (r && r.catch) r.catch(function () {}); return r; } catch (e) {}
    };
    var rfs = Element.prototype.requestFullscreen;
    if (rfs) {
      Element.prototype.requestFullscreen = function () {
        try { var r = rfs.apply(this, arguments); if (r && r.catch) r.catch(function () {}); return r; }
        catch (e) { return Promise.resolve(); }
      };
    }
  } catch (e) {}

  window.addEventListener("error", function (ev) {
    var m = ev && ev.message ? String(ev.message) : "";
    if (m.indexOf("pointer lock") !== -1 || m.indexOf("Fullscreen") !== -1) ev.preventDefault();
  }, true);

  var loaderReady = false;
  var filesReady = false;
  var started = false;

  window.StartUnityInstance = function () {
    if (started || !loaderReady || !filesReady || !config) return;
    if (typeof createUnityInstance !== "function") return;
    started = true;
    createUnityInstance(canvas, config, function (progress) {
      spinner.style.display = "none";
      progressBarEmpty.style.display = "";
      progressBarFull.style.width = (100 * progress) + "%";
    }).then(function (unityInstance) {
      window.myGameInstance = unityInstance;
      loadingCover.style.background = "";
      loadingCover.style.display = "none";
      window.FocusGame();
    }).catch(function (message) {
      console.error(message);
    });
  };
  window.StartUnityInstance_IfUnloaded = window.StartUnityInstance;

  window.InitGame = function () {
    window.initGame = true;
    if (window.nowFullAdOpen === true && window.myGameInstance != null) {
      window.myGameInstance.SendMessage("YandexGame", "OpenFullAd");
    }
  };

  window.FullAdShow = function () {
    try {
      if (window.nowFullAdOpen !== true && window.ysdk !== null) {
        window.ysdk.adv.showFullscreenAdv({
          callbacks: {
            onOpen: function () {
              window.nowFullAdOpen = true;
              if (window.initGame === true) window.myGameInstance.SendMessage("YandexGame", "OpenFullAd");
            },
            onClose: function (wasShown) {
              window.nowFullAdOpen = false;
              if (window.initGame === true) {
                window.myGameInstance.SendMessage("YandexGame", "CloseFullAd", wasShown ? "true" : "false");
              }
              window.FocusGame();
            },
            onError: function () {
              window.nowFullAdOpen = false;
              if (window.initGame === true) window.myGameInstance.SendMessage("YandexGame", "ErrorFullAd");
              window.FocusGame();
            }
          }
        });
      }
    } catch (e) {}
  };

  window.RewardedShow = function (id) {
    try {
      window.ysdk.adv.showRewardedVideo({
        callbacks: {
          onOpen: function () { window.myGameInstance.SendMessage("YandexGame", "OpenVideo"); },
          onClose: function () { window.myGameInstance.SendMessage("YandexGame", "CloseVideo"); window.FocusGame(); },
          onRewarded: function () { window.myGameInstance.SendMessage("YandexGame", "RewardVideo", id); },
          onError: function () { window.myGameInstance.SendMessage("YandexGame", "ErrorVideo"); }
        }
      });
    } catch (e) {}
  };

  window.StickyAdActivity = function (show) {
    try {
      window.ysdk.adv.getBannerAdvStatus().then(function (s) {
        if (s.stickyAdvIsShowing) { if (!show) window.ysdk.adv.hideBannerAdv(); }
        else if (show) window.ysdk.adv.showBannerAdv();
      });
    } catch (e) {}
  };

  window.InitLeaderboard = function () {
    try {
      window.ysdk.getLeaderboards().then(function (lb) {
        window.leaderboard = lb;
        window.myGameInstance.SendMessage("YandexGame", "InitializedLB");
      });
    } catch (e) {}
  };

  window.SetLeaderboardScores = function (_name, score) {
    try {
      window.ysdk.getLeaderboards().then(function (lb) { lb.setLeaderboardScore(_name, score); });
    } catch (e) {}
  };

  window.GetLeaderboardScores = function (nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
    try {
      var jsonEntries = { technoName: "", isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: "" };
      window.ysdk.getLeaderboards()
        .then(function (lb) {
          return lb.getLeaderboardDescription(nameLB).then(function (r) {
            jsonEntries.technoName = nameLB;
            jsonEntries.isDefault = r.default;
            jsonEntries.isInvertSortOrder = r.description.invert_sort_order;
            jsonEntries.decimalOffset = r.description.score_format.options.decimal_offset;
            jsonEntries.type = r.description.type;
            return lb.getLeaderboardEntries(nameLB, {
              quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround
            });
          });
        })
        .then(function (r) {
          var jsonPlayers = window.EntriesLB(r, maxPlayers, photoSize);
          var combined = {}, k;
          for (k in jsonEntries) combined[k] = jsonEntries[k];
          for (k in jsonPlayers) combined[k] = jsonPlayers[k];
          window.myGameInstance.SendMessage("YandexGame", "LeaderboardEntries", JSON.stringify(combined));
        })
        .catch(function () {});
    } catch (e) {}
  };

  window.EntriesLB = function (r, maxPlayers, photoSize) {
    var text = "";
    var count = r.entries.length < maxPlayers ? r.entries.length : maxPlayers;
    var ranks = new Array(count), photos = new Array(count), names = new Array(count);
    var scores = new Array(count), uniqueIDs = new Array(count);

    for (var i = 0; i < count; i++) {
      ranks[i] = r.entries[i].rank;
      scores[i] = r.entries[i].score;
      uniqueIDs[i] = r.entries[i].player.uniqueID;

      if (photoSize === "nonePhoto" || r.entries[i].player.scopePermissions.avatar !== "allow") photos[i] = "nonePhoto";
      else photos[i] = r.entries[i].player.getAvatarSrc(photoSize);

      if (r.entries[i].player.scopePermissions.public_name !== "allow") names[i] = "anonymous";
      else names[i] = r.entries[i].player.publicName;

      text += ranks[i] + ". " + names[i] + ": " + scores[i] + "\n";
    }
    if (count === 0) text = "no data";

    return { entries: text, ranks: ranks, photos: photos, names: names, scores: scores, uniqueIDs: uniqueIDs };
  };

  window.Review = function () {
    try {
      window.ysdk.feedback.canReview().then(function (a) {
        if (a.value) {
          window.ysdk.feedback.requestReview().then(function (x) {
            window.myGameInstance.SendMessage("YandexGame", "ReviewSent", x.feedbackSent ? "true" : "false");
            window.FocusGame();
          });
        } else window.FocusGame();
      });
    } catch (e) { window.FocusGame(); }
  };

  window.PromptShow = function () {
    try {
      window.ysdk.shortcut.showPrompt().then(function (r) {
        window.myGameInstance.SendMessage("YandexGame", r.outcome === "accepted" ? "OnPromptSuccess" : "OnPromptFail");
        window.FocusGame();
      });
    } catch (e) { window.FocusGame(); }
  };

  window.SaveCloud = function (jsonData, flush) {
    if (window.player == null) return;
    try { window.player.setData({ saves: [jsonData] }, flush); } catch (e) {}
  };

  window.LoadCloud = function (sendback) {
    return new Promise(function (resolve) {
      function fail() {
        if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "SetLoadSaves", "noData");
        resolve("noData");
      }
      if (window.ysdk == null) return fail();
      try {
        window.ysdk.getPlayer({ scopes: false }).then(function (p) {
          p.getData(["saves"]).then(function (data) {
            if (data && data.saves) {
              var s = JSON.stringify(data.saves);
              if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "SetLoadSaves", s);
              resolve(s);
            } else fail();
          }).catch(fail);
        }).catch(fail);
      } catch (e) { fail(); }
    });
  };

  window.GetPayments = function (sendback) {
    return new Promise(function (resolve) {
      try {
        if (window.ysdk == null) return resolve("none");
        window.ysdk.getPayments().then(function (p) {
          window.payments = p;
          p.getCatalog().then(function (products) {
            p.getPurchases().then(function (purchases) {
              var productID = [], title = [], description = [], imageURI = [], priceValue = [], consumed = [];
              for (var i = 0; i < products.length; i++) {
                productID[i] = products[i].id;
                title[i] = products[i].title;
                description[i] = products[i].description;
                imageURI[i] = products[i].imageURI;
                priceValue[i] = products[i].priceValue;
                consumed[i] = true;
                for (var j = 0; j < purchases.length; j++) {
                  if (purchases[j].productID === productID[i]) { consumed[i] = false; break; }
                }
              }
              var s = JSON.stringify({
                id: productID, title: title, description: description, imageURI: imageURI,
                priceValue: priceValue, consumed: consumed, language: window.ysdk.environment.i18n.lang
              });
              if (sendback && window.myGameInstance) window.myGameInstance.SendMessage("YandexGame", "PaymentsEntries", s);
              resolve(s);
            }).catch(function () { resolve("none"); });
          }).catch(function () { resolve("none"); });
        }).catch(function () { resolve("none"); });
      } catch (e) { resolve("none"); }
    });
  };

  window.BuyPayments = function (id) {
    try {
      if (window.payments != null) {
        window.payments.purchase(id).then(function () {
          window.ConsumePurchase(id);
          window.FocusGame();
        }).catch(function () {
          window.myGameInstance.SendMessage("YandexGame", "OnPurchaseFailed", id);
          window.FocusGame();
        });
      } else {
        window.myGameInstance.SendMessage("YandexGame", "OnPurchaseFailed", id);
      }
    } catch (e) { window.FocusGame(); }
  };

  window.ConsumePurchase = function (id) {
    try {
      if (window.payments == null) return;
      window.payments.getPurchases().then(function (purchases) {
        for (var i = 0; i < purchases.length; i++) {
          if (purchases[i].productID === id) {
            window.payments.consumePurchase(purchases[i].purchaseToken);
            window.myGameInstance.SendMessage("YandexGame", "OnPurchaseSuccess", id);
          }
        }
      });
    } catch (e) {}
  };

  window.ConsumePurchases = function () {
    try {
      if (window.payments == null) return;
      window.payments.getPurchases().then(function (purchases) {
        for (var i = 0; i < purchases.length; i++) {
          window.payments.consumePurchase(purchases[i].purchaseToken);
          window.myGameInstance.SendMessage("YandexGame", "OnPurchaseSuccess", purchases[i].productID);
        }
      });
    } catch (e) {}
  };

  window.RequestingEnvironmentData = function (sendback) {
    return new Promise(function (resolve) {
      if (window.ysdk == null) return resolve("null");
      try {
        window.ysdk.feedback.canReview().then(function (a) {
          var reviewCanShow = !!a.value;
          window.ysdk.shortcut.canShowPrompt().then(function (prompt) {
            var promptCanShow = !!(prompt && prompt.canShow);
            var ua = navigator.userAgent, browser;
            if (ua.indexOf("YaBrowser") !== -1 || ua.indexOf("YaSearchBrowser") !== -1) browser = "Yandex";
            else if (ua.indexOf("Opera") !== -1 || ua.indexOf("OPR") !== -1) browser = "Opera";
            else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
            else if (ua.indexOf("MSIE") !== -1) browser = "IE";

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
