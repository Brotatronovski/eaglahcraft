<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #55ff55;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #game-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: none;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p id="status-text">Fetching game data...</p>
  </div>

  <iframe 
    id="game-frame" 
    allow="autoplay; fullscreen; pointer-lock; camera; microphone; focus-without-user-activation" 
    allowfullscreen="true">
  </iframe>

  <script>
    const targetUrl = "https://cdn.jsdelivr.net/gh/Brotatronovski/eaglahcraft@main/67.html";

    async function launchGame() {
      const statusText = document.getElementById("status-text");
      const loader = document.getElementById("loader");
      const frame = document.getElementById("game-frame");

      try {
        statusText.innerText = "Downloading client file...";
        const response = await fetch(targetUrl);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - File not accessible`);
        }

        let rawContent = await response.text();

        // Remove XML declarations if present at the top of the file
        rawContent = rawContent.replace(/^<\?xml[^>]*\?>/i, "").trim();

        statusText.innerText = "Launching game engine...";

        // Force browser parsing as text/html
        const frameDoc = frame.contentWindow.document;
        frameDoc.open();
        frameDoc.write(rawContent);
        frameDoc.close();

        // Display game frame
        loader.style.display = "none";
        frame.style.display = "block";

      } catch (error) {
        statusText.innerText = "Error loading game: " + error.message;
        console.error("Launcher error:", error);
      }
    }

    launchGame();
  </script>

</body>
</html>
